<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;fill:#172033}
    .title{font-size:40px;font-weight:700}.sub{font-size:22px}.h{font-size:28px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}
    .box{fill:#fff;stroke:#c8d4e8;stroke-width:2;rx:16}.blue{fill:#eef5ff;stroke:#7ba7ef}.green{fill:#eefaf1;stroke:#6bb47c}.orange{fill:#fff6ed;stroke:#e89a55}.red{fill:#fff0f0;stroke:#d87b7b}
    .tblh{fill:#3267b5}.tblhg{fill:#4c9a5d}.white{fill:white}.ok{fill:#167a3f;font-weight:700}.ng{fill:#b74444;font-weight:700}
  </style>
  <rect width="1200" height="1500" fill="#f7f9fc"/>
  <text x="600" y="60" text-anchor="middle" class="title">日ごとの請求額合計とユニークな請求書数を集計する</text>
  <rect x="60" y="95" width="1080" height="90" class="box blue"/>
  <text x="600" y="132" text-anchor="middle" class="h">目的：billing_date ごとに total_amount と unique_billing_count を求める</text>
  <text x="600" y="164" text-anchor="middle" class="sub">ポイント：ユニークの基準は「請求書ID = billing_id」</text>

  <text x="70" y="235" class="h">元データ</text>
  <rect x="70" y="260" width="500" height="260" class="box"/>
  <rect x="70" y="260" width="500" height="50" class="tblh"/>
  <text x="110" y="292" class="b white">billing_date</text><text x="270" y="292" class="b white">billing_id</text><text x="390" y="292" class="b white">patient_id</text><text x="485" y="292" class="b white">amount</text>
  <g class="b"><text x="110" y="350">7/1</text><text x="270" y="350">INV-001</text><text x="390" y="350">P001</text><text x="500" y="350">1000</text>
  <text x="110" y="395">7/1</text><text x="270" y="395">INV-001</text><text x="390" y="395">P001</text><text x="500" y="395">500</text>
  <text x="110" y="440">7/1</text><text x="270" y="440">INV-002</text><text x="390" y="440">P002</text><text x="500" y="440">800</text>
  <text x="110" y="485">7/2</text><text x="270" y="485">INV-003</text><text x="390" y="485">P001</text><text x="500" y="485">1200</text></g>

  <text x="640" y="235" class="h">求める結果</text>
  <rect x="640" y="260" width="490" height="180" class="box green"/>
  <rect x="640" y="260" width="490" height="50" class="tblhg"/>
  <text x="680" y="292" class="b white">billing_date</text><text x="825" y="292" class="b white">total_amount</text><text x="970" y="292" class="b white">unique_count</text>
  <text x="690" y="355" class="b">7/1</text><text x="850" y="355" class="b">2300</text><text x="1020" y="355" class="b">2</text>
  <text x="690" y="405" class="b">7/2</text><text x="850" y="405" class="b">2200</text><text x="1020" y="405" class="b">2</text>

  <text x="70" y="585" class="h">選択肢の読み分け</text>
  <rect x="70" y="615" width="500" height="210" class="box red"/><text x="95" y="655" class="h">A: sum(amount), sum(billing_id)</text><text x="95" y="700" class="ng">× 誤り</text><text x="95" y="740" class="b">billing_id はID文字列。合計する対象ではない。</text>
  <rect x="630" y="615" width="500" height="210" class="box red"/><text x="655" y="655" class="h">B: sum(amount), count_distinct(patient_id)</text><text x="655" y="700" class="ng">× 基準が違う</text><text x="655" y="740" class="b">患者数ではなく、ユニークな請求書数を求めたい。</text>
  <rect x="70" y="855" width="500" height="210" class="box orange"/><text x="95" y="895" class="h">C: sum(amount), count_distinct(billing_id)</text><text x="95" y="940" class="ok">✓ 正解</text><text x="95" y="980" class="b">金額は合計。請求書IDは重複を除いて数える。</text>
  <rect x="630" y="855" width="500" height="210" class="box red"/><text x="655" y="895" class="h">D: col(amount), count(billing_id)</text><text x="655" y="940" class="ng">× 誤り</text><text x="655" y="980" class="b">col() は集計関数ではない。count() は重複も数える。</text>

  <rect x="70" y="1110" width="1060" height="260" class="box blue"/>
  <text x="95" y="1150" class="h">PySpark の正解コード</text>
  <text x="95" y="1195" class="code">from pyspark.sql.functions import sum, count_distinct</text>
  <text x="95" y="1235" class="code">daily = (billing</text>
  <text x="125" y="1270" class="code">.groupBy("billing_date")</text>
  <text x="125" y="1305" class="code">.agg(</text>
  <text x="155" y="1340" class="code">sum("amount_billed").alias("total_amount"),</text>
  <text x="155" y="1375" class="code">count_distinct("billing_id").alias("unique_billing_count")</text>
  <text x="125" y="1410" class="code">))</text>
  <text x="690" y="1205" class="h">覚え方</text>
  <text x="690" y="1250" class="b">sum = 数値を合計</text>
  <text x="690" y="1290" class="b">count = 行数（NULL除外）</text>
  <text x="690" y="1330" class="b">count_distinct = ユニーク件数</text>
  <text x="690" y="1370" class="b">col = 列を参照するだけ。集計しない</text>
</svg>