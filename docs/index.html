<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osmosis — 資料</title>
<style>
:root{
  color-scheme: light dark;
  --paper:#F6F7F9; --surface:#FFF; --ink:#15181E; --muted:#5C6470;
  --faint:#8A929E; --rule:#E2E5EA; --accent:#26418F;
  --f-display:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#12141A; --surface:#181B22; --ink:#E6E8EC; --muted:#9AA2AF;
         --faint:#6C7481; --rule:#262A33; --accent:#94A9F0; }
}
*,*::before,*::after{ box-sizing:border-box }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body);
      font-size:15px; line-height:1.9; font-feature-settings:"palt" 1; }
.wrap{ max-width:56rem; margin:0 auto; padding:3rem 1.5rem 4.5rem }
.eyebrow{ font-family:var(--f-mono); font-size:.6875rem; letter-spacing:.16em;
          text-transform:uppercase; color:var(--faint); margin-bottom:.75rem }
h1{ font-family:var(--f-display); font-size:2.25rem; font-weight:600; line-height:1.35;
    margin:0 0 .75rem }
.lede{ color:var(--muted); margin:0; max-width:60ch }
.rule{ height:2px; background:var(--ink); width:3.5rem; margin:1.5rem 0 0 }
.tools{ display:flex; gap:.5rem; margin:2.5rem 0 0 }
.btn{ font:inherit; font-size:.75rem; background:transparent; color:var(--muted);
      border:1px solid var(--rule); border-radius:3px; padding:.3rem .6rem; cursor:pointer }
.btn:hover{ color:var(--ink); border-color:var(--faint) }

/* 番組ごとに折りたたむ。数が増えても一覧の頭から目的の番組へ届くようにする */
details.show{ border-top:1px solid var(--rule); margin-top:1.5rem }
details.show > summary{ list-style:none; cursor:pointer;
      display:flex; flex-wrap:wrap; align-items:baseline; gap:.25rem .75rem; padding:1rem .25rem }
details.show > summary::-webkit-details-marker{ display:none }
details.show > summary:hover .show-name{ color:var(--accent) }
.show-name{ font-size:1.25rem; font-weight:650 }
.show-sub{ font-size:.8125rem; color:var(--muted) }
.num{ font-variant-numeric:tabular-nums }
.show-count{ margin-left:auto; font-family:var(--f-mono); font-size:.75rem; color:var(--faint) }
.show-mark{ font-family:var(--f-mono); font-size:.6875rem; letter-spacing:.1em;
      color:var(--faint); white-space:nowrap }
details.show[open] .show-mark::after{ content:"閉じる −" }
details.show:not([open]) .show-mark::after{ content:"開く ＋" }
ul{ list-style:none; margin:0 0 1rem; padding:0; border-top:1px solid var(--rule) }
li{ border-bottom:1px solid var(--rule) }
li a{ display:grid; grid-template-columns:5rem minmax(0,1fr); gap:1rem; align-items:baseline;
      padding:.75rem .25rem; color:inherit; text-decoration:none }
li a:hover{ background:var(--surface) }
li a:hover .t{ color:var(--accent); text-decoration:underline; text-underline-offset:.2em }
.ep{ font-family:var(--f-mono); font-size:.75rem; color:var(--faint) }
.t{ font-weight:600 }
footer{ margin-top:4rem; padding-top:1rem; border-top:1px solid var(--rule);
        font-size:.75rem; color:var(--faint) }
@media (max-width:34rem){ li a{ grid-template-columns:1fr; gap:.1rem } }

/* ---- ハブ（ルート）。ページの入口だけを並べる ---- */
.pages{ margin-top:2.5rem; border-top:1px solid var(--rule) }
a.page-card{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.25rem 1rem;
      align-items:baseline; padding:1.25rem .25rem; border-bottom:1px solid var(--rule);
      color:inherit; text-decoration:none }
a.page-card:hover{ background:var(--surface) }
a.page-card:hover .page-name{ color:var(--accent); text-decoration:underline;
      text-underline-offset:.2em }
.page-name{ font-size:1.25rem; font-weight:650 }
.page-lede{ grid-column:1; font-size:.8125rem; color:var(--muted); margin:0; max-width:60ch }
.page-count{ font-family:var(--f-mono); font-size:.75rem; color:var(--faint); white-space:nowrap }
.page-card.empty .page-name{ color:var(--muted) }

/* ---- ページ間の行き来 ---- */
.crumb{ font-size:.75rem; color:var(--faint); margin-bottom:1rem }
.crumb a{ color:var(--muted) }
.crumb a:hover{ color:var(--accent) }
.siblings{ display:flex; flex-wrap:wrap; gap:.5rem; margin-top:2.5rem }
.siblings a{ font-size:.75rem; color:var(--muted); border:1px solid var(--rule);
      border-radius:3px; padding:.3rem .6rem; text-decoration:none }
.siblings a:hover{ color:var(--ink); border-color:var(--faint) }
.siblings a[aria-current="page"]{ color:var(--ink); border-color:var(--faint);
      background:var(--surface) }
.empty-note{ margin-top:2.5rem; padding:1.5rem .25rem; border-top:1px solid var(--rule);
      color:var(--muted); font-size:.875rem }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow"><span>osmosis</span></div>
      <h1>資料</h1>
      <p class="lede">各回の台本の元になったドキュメントです。1ファイルで完結しているので、
        保存すればオフラインでも読めます。</p>
      <div class="rule"></div>
    </header>

    <div class="pages">
      <a class="page-card" href="databricks/">
        <span class="page-name">Databricks</span>
        <span class="page-count num">102 件</span>
        <p class="page-lede">Databricks を扱ううえで押さえておきたい仕組みを整理した資料です。
各回の台本の元になっています。</p>
      </a>
      <a class="page-card empty" href="english/">
        <span class="page-name">English</span>
        <span class="page-count num">0 件</span>
        <p class="page-lede">英語まわりの回の資料です。</p>
      </a>
      <a class="page-card empty" href="quiz/">
        <span class="page-name">クイズ</span>
        <span class="page-count num">0 件</span>
        <p class="page-lede">資料の内容を出題形式にしたものです。回答は端末の中にだけ残ります。</p>
      </a>
    </div>

    <footer>3 ページ / 102 件 / 更新 2026-08-15</footer>
  </div>
</body>
</html>
